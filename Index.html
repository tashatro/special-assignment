<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Special Assignment</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #ff1a1a;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
      overflow: hidden;
    }
    .message {
      width: min(90%, 650px);
      padding: 40px 20px;
      opacity: 0;
      transform: scale(.96);
      animation: reveal 2.2s ease forwards;
    }
    h1 {
      margin: 0 0 45px;
      font-size: clamp(28px, 6vw, 52px);
      line-height: 1.25;
      letter-spacing: 3px;
      font-weight: 800;
      text-transform: uppercase;
      color: #ff1a1a;
      animation: redPulse 1.8s ease-in-out 2.2s infinite;
    }
    .time {
      margin: 25px 0 10px;
      font-size: clamp(42px, 10vw, 72px);
      font-weight: 900;
      letter-spacing: 5px;
      color: #ff1a1a;
    }
    .location {
      margin-top: 12px;
      font-size: clamp(22px, 5vw, 34px);
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ff1a1a;
    }
    .footer {
      margin-top: 55px;
      font-size: clamp(16px, 4vw, 21px);
      color: #b90000;
      letter-spacing: 1.5px;
      font-style: italic;
    }
    @keyframes reveal {
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes redPulse {
      0%, 100% {
        color: #b80000;
        text-shadow: 0 0 5px rgba(255,0,0,.35), 0 0 10px rgba(255,0,0,.2);
      }
      50% {
        color: #ff2929;
        text-shadow: 0 0 10px rgba(255,0,0,.9), 0 0 25px rgba(255,0,0,.7), 0 0 45px rgba(255,0,0,.45);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .message, h1 { animation: none; opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <main class="message">
    <h1>Your Presence Is Required<br>For A Special Assignment.</h1>
    <div class="time">19:00</div>
    <div class="location">Location: Room 6</div>
    <div class="footer">Further instructions will follow.</div>
  </main>
</body>
</html>
